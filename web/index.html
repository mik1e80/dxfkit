<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dxfkit —— DXF 图纸读取与辅助检查</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="page-head">
      <h1>dxfkit</h1>
      <p>
        拖入 DXF，查看图纸预览，并检查开放轮廓、重复线段、交叉和指定净距。
        报告只覆盖已支持的二维几何；加工前仍需确认单位、材料、刀具和工艺。
      </p>
    </header>

    <main class="panes">
      <section class="pane">
        <div class="pane-head">
          <h2>图纸文件</h2>
          <span class="status" id="status">等待文件</span>
        </div>
        <div class="dropzone" id="dropzone">
          <div class="dropzone-hint">
            <p class="dropzone-big">把 DXF 文件拖到这里</p>
            <p>
              或者<button type="button" class="link" id="pick">选一个文件</button>，
              也可以<button type="button" class="link" id="sample">用内置样例试一下</button>
            </p>
            <p class="dropzone-small">全程在浏览器里完成，文件不会上传到任何地方</p>
          </div>
          <input type="file" id="file" accept=".dxf" hidden />
        </div>
        <div class="preview" id="preview"></div>
      </section>

      <section class="pane">
        <div class="pane-head">
          <h2>加工前检查</h2>
          <label class="gap-field">
            最小净距
            <input type="number" id="min-gap" value="0" min="0" step="any" />
            <span class="gap-hint">0 = 不查（单位同图纸）</span>
          </label>
        </div>
        <pre class="report" id="report">拖进一张 DXF，这里出检查报告。</pre>
      </section>
    </main>

    <script src="dist/web.js"></script>
    <script src="app.js"></script>
  </body>
</html>
