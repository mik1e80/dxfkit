name: 检查、构建、测试

# 每次推到 main、以及每个 PR 都跑一遍。
#
# 检查库、CLI与网页；pages.yml从同一提交重建网页后再部署。
#
# 三件事分开跑而不是串成一条命令，是为了在 Actions 页面上能一眼看出是哪一步挂了。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 装 MoonBit 工具链
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: 打印版本
        run: |
          moon version --all
          # 验收要求 moonc 不低于 0.10.14。这里不写死版本，但把版本打进日志，
          # 万一以后工具链降级了能从日志看出来
          moonc -v

      # 依赖装到 .mooncakes/，缓存起来省得每次重新下
      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: ~/.moon/registry
          key: moon-registry-${{ hashFiles('moon.mod') }}
          restore-keys: moon-registry-

      - name: 解析依赖
        run: moon update

      - name: 检查（全目标，零警告才算过）
        run: moon check --target all --deny-warn

      - name: 构建
        run: moon build

      - name: 测试
        run: moon test

      - name: JS后端测试
        run: moon test --target js

      - name: Native后端测试
        run: moon test --target native

      - name: 几何与检查器错误检出能力
        run: node scripts/verify-test-sensitivity.cjs

      - name: CLI实际示例回归
        run: node cli/smoke.cjs

      - name: 第三方图纸分层验证记录
        run: node scripts/verify-corpus-records.cjs

      - name: 网页构建与报告回归
        run: |
          bash web/build.sh
          node web/smoke.cjs

      - name: 六类最小交付用例
        run: node scripts/verify-delivery.cjs

      - name: 混合输入检查完整性
        run: node scripts/verify-completeness.cjs

      - name: 独立 MoonBit 工程调用（Wasm 与 Native）
        run: |
          node scripts/verify-consumer.cjs
          node scripts/verify-consumer.cjs --target native
