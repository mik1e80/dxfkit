name: 按需检查与部署

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      validation:
        description: '默认仅运行R12及受影响的必要检查；full须按需手动选择'
        type: choice
        default: targeted
        options: [targeted, full]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
      - name: 安装固定版本MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- '0.10.14+7d59c7ec9'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: R12定向验证（含两个曾失败的语料回归，不是全量）
        if: github.event.inputs.validation != 'full'
        run: node scripts/verify-advisor.cjs --fresh
      - name: 手动完整验收（仅按需运行）
        if: github.event.inputs.validation == 'full'
        run: node scripts/verify-reproduction.cjs --fresh
      - name: 保存同提交验证记录
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-${{ github.sha }}
          path: |
            _build/reproduction.json
            _build/maintenance.json
            _build/model-validation.json
            _build/submission-evidence.json
            web/dist/release.json
            output/pdf/dxfkit-submission-one-page.pdf
            docs/corpus-validation.json
            examples/model-validation/results.json
            examples/r12-validation/results.tsv
            examples/r12-validation/external-actual
      - name: 上传完整验收后的同提交站点
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.inputs.validation == 'full'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.inputs.validation == 'full'
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
