name: 按需检查与部署

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      validation:
        description: '默认仅运行R12及受影响的必要检查；full须按需手动选择'
        type: choice
        default: targeted
        options: [targeted, full]
      deploy_pages:
        description: '所选验证通过后发布同一提交的 Pages 演示'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: 安装固定版本MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- '1.0.0-rc1+3c0520448'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: R12定向验证（含两个曾失败的语料回归，不是全量）
        if: github.event.inputs.validation != 'full'
        run: node scripts/verify-advisor.cjs --fresh
      - name: 手动完整验收（仅按需运行）
        if: github.event.inputs.validation == 'full'
        run: node scripts/verify-reproduction.cjs --fresh
      - name: 在独立进程核对大图资源边界
        if: github.event.inputs.validation != 'full'
        run: |
          moon build examples/performance --target native --release --frozen --deny-warn
          benchmark=_build/native/release/build/examples/performance/performance.exe
          if [ ! -x "$benchmark" ]; then benchmark=${benchmark%.exe}; fi
          ulimit -v 1048576
          timeout --kill-after=5s 45s /usr/bin/time -f 'peak_rss_kib=%M' "$benchmark" > _build/resource-benchmark.txt 2>&1
          cat _build/resource-benchmark.txt
      - name: 重放真实 CAD 的 OCS、阵列和 VIEWPORT 案例
        if: github.event.inputs.validation != 'full'
        run: |
          sha256sum --check examples/cad-ocs/SHA256SUMS
          moon run examples/cad-ocs/runner --deny-warn
      - name: 保存同提交验证记录
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-${{ github.sha }}
          path: |
            _build/reproduction.json
            _build/maintenance.json
            _build/model-validation.json
            _build/submission-evidence.json
            _build/resource-benchmark.txt
            web/dist/release.json
            output/pdf/dxfkit-submission-one-page.pdf
            docs/corpus-validation.json
            examples/model-validation/results.json
            examples/r12-validation/results.tsv
            examples/r12-validation/external-actual
      - name: 上传验证通过后的同提交站点
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_pages
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
