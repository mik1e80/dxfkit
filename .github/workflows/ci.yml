name: 按需检查与部署

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      validation:
        description: '验证范围：默认只运行当前整改相关测试'
        type: choice
        default: targeted
        options: [targeted, full]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'

      - name: 安装固定版本 MoonBit（不复用依赖缓存）
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- '0.10.14+7d59c7ec9'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: 从干净检出按需验证
        run: |
          if [ "${{ github.event.inputs.validation }}" = "full" ]; then
            node scripts/verify-reproduction.cjs --fresh
          else
            node scripts/verify-advisor.cjs --fresh
          fi

      - name: 保存该提交的验证记录
        uses: actions/upload-artifact@v6
        with:
          name: verification-${{ github.sha }}
          path: |
            _build/reproduction.json
            _build/model-validation.json
            _build/submission-evidence.json
            web/dist/release.json
            output/pdf/dxfkit-submission-one-page.pdf
            examples/model-validation/results.json
            examples/model-validation/SUMMARY.md

      - name: 上传已通过验证的同一站点产物
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
