name: 格式与公开接口检查

on:
  push:
    branches: [main]
    paths: ['**/*.mbt', '**/*.md', '**/*.mbtx', '**/moon.pkg', 'pkg.generated.mbti', '.gitignore', '.gitattributes', 'scripts/verify-maintenance.cjs', '.github/workflows/maintenance.yml']
  pull_request:
    paths: ['**/*.mbt', '**/*.md', '**/*.mbtx', '**/moon.pkg', 'pkg.generated.mbti', '.gitignore', '.gitattributes', 'scripts/verify-maintenance.cjs', '.github/workflows/maintenance.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: 安装固定 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- '0.10.14+7d59c7ec9'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: 获取依赖并检查格式和 API 快照
        run: |
          moon update
          node scripts/verify-maintenance.cjs
      - name: 诊断洪泛回归与维护文档链接（非全量）
        run: |
          moon test maintenance_security_test.mbt maintenance_foundation_test.mbt topology_sweep_wbtest.mbt --target wasm --deny-warn
          moon run scripts/verify-maintenance-docs.mbtx --deny-warn
      - name: 保存轻量验证记录
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: maintenance-${{ github.sha }}
          path: |
            _build/maintenance.json
            pkg.generated.mbti
